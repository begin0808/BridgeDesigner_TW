<jqxWindow
  #dialog
  [isModal]="true"
  [autoOpen]="false"
  [width]="794"
  [height]="752"
  [position]="'center'"
  (onOpen)="handleDialogOpen()"
>
  <div
    #header
    class="header"
  >
    切換設計版本（歷史迭代）
  </div>
  <div
    #content
    class="content"
  >
    <div class="top-row">
      <div class="select-label">選擇一個設計版本：</div>
    </div>
    <div class="left-column">
      <jqxTabs
        #tabs
        style="margin-left: 8px"
        [width]="614"
        [height]="360"
        [position]="'top'"
        [animationType]="'none'"
        [selectionTracker]="false"
        (onSelected)="handleTabSelected($event)"
      >
        <ul>
          <li>樹狀檢視</li>
          <li>清單檢視</li>
        </ul>
        <div>
          <jqxTreeGrid
            #tree
            style="margin: 8px"
            [width]="596"
            [height]="308"
            [columns]="treeColumns"
            [columnsHeight]="30"
            [columnsResize]="true"
            [selectionMode]="'singleRow'"
            [source]="dataAdapter"
            (onRowDoubleClick)="handleRowDoubleClick()"
            (onRowSelect)="handleTreeRowSelect($event)"
          ></jqxTreeGrid>
        </div>
        <div>
          <jqxGrid
            #grid
            style="margin: 8px"
            [width]="596"
            [height]="308"
            [columns]="gridColumns"
            [columnsheight]="30"
            [columnsresize]="true"
            [rowsheight]="22"
            [selectionmode]="'singleRow'"
            [source]="dataAdapter"
            (onRowDoubleClick)="handleRowDoubleClick()"
            (onRowselect)="handleGridRowSelect($event)"
          >
          </jqxGrid>
        </div>
      </jqxTabs>
      <div class="dialog-topic">預覽：</div>
      <canvas
        #preview
        class="preview"
        width="614"
        height="298"
      >
      </canvas>
    </div>
    <div class="right-column">
      <fieldset class="design-tip">
        <legend class="dialog-topic">設計提示：</legend>
        <div>
          <p>
            <img
              class="tip-icon"
              src="img/tipicon.png"
            />
            <b>樹狀檢視</b>會顯示每個設計版本是從哪一個舊版本演變而來；<b>清單檢視</b>則依建立時間順序排列，兩者都很實用。
          </p>
          <p>
            在樹狀檢視中，箭頭會指向其衍生來源：⇖ 代表左上方版本，⇑ 代表正上方版本。點擊展開／收合按鈕可折疊分支。
          </p>
          <p>可使用鍵盤上下方向鍵切換不同版本，並於下方<b>預覽</b>視窗即時查看設計變化。</p>
        </div>
      </fieldset>
      <div>
        <jqxButton
          #cancelButton
          id="cancelButton"
          (onClick)="dialog.close()"
          style="float: right; margin-top: 40px; margin-right: 8px"
          [width]="'110px'"
          >取消</jqxButton
        >
      </div>
      <div>
        <jqxButton
          #okButton
          (onClick)="handleOkClick()"
          style="float: right; margin-top: 16px; margin-right: 8px"
          [width]="'110px'"
          >確定</jqxButton
        >
      </div>
    </div>
  </div>
</jqxWindow>
