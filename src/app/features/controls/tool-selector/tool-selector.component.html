<jqxWindow
  #dialog
  [autoOpen]="false"
  [position]="{ x: 12, y: 122 }"
  [isModal]="false"
  [width]="windowWidth"
  [height]="windowHeight"
  [resizable]="false"
  (onClose)="handleClose()"
>
  <div class="header">
    <img
      src="img/tools.png"
      class="header-icon"
    />
    繪圖工具
  </div>
  <div class="content">
    <jqxToggleButton
      #jointsButton
      title="繪製節點"
      [imgSrc]="'img/joint.png'"
      [imgWidth]="imgSize"
      [imgHeight]="imgSize"
      [width]="buttonSize"
      [height]="buttonSize"
      [toggled]="true"
    ></jqxToggleButton>
    <jqxToggleButton
      #membersButton
      title="繪製桿件"
      [imgSrc]="'img/member.png'"
      [imgWidth]="imgSize"
      [imgHeight]="imgSize"
      [width]="buttonSize"
      [height]="buttonSize"
    ></jqxToggleButton>
    <jqxToggleButton
      #selectButton
      title="選取與移動"
      [imgSrc]="'img/arrow.png'"
      [imgWidth]="imgSize"
      [imgHeight]="imgSize"
      [width]="buttonSize"
      [height]="buttonSize"
    ></jqxToggleButton>
    <jqxToggleButton
      #eraseButton
      title="橡皮擦（刪除節點或桿件）"
      [imgSrc]="'img/eraser.png'"
      [imgWidth]="imgSize"
      [imgHeight]="imgSize"
      [width]="buttonSize"
      [height]="buttonSize"
    ></jqxToggleButton>
  </div>
</jqxWindow>
