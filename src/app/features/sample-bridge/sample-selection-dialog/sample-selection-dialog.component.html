<jqxWindow
  #dialog
  [isModal]="true"
  [autoOpen]="false"
  [width]="640"
  [height]="590"
  (onOpen)="handleDialogOpen()"
>
  <div
    #header
    class="header"
  >
    載入範例設計
  </div>
  <div
    #content
    class="content"
  >
    <div class="top-row">
      <div class="select-label">選擇一個範例：</div>
    </div>
    <div class="left-column">
      <jqxListBox
        #sampleList
        style="margin-left: 8px"
        [width]="500"
        [source]="source"
        [selectedIndex]="0"
        [displayMember]="'description'"
        (onSelect)="handleSelect()"
      >
      </jqxListBox>
      <div class="dialog-topic">預覽：</div>
      <canvas
        #preview
        class="preview"
        width="498"
        height="298"
      >
      </canvas>
    </div>
    <div class="right-column">
      <fieldset class="design-tip">
        <legend class="dialog-topic">設計提示：</legend>
        <div>
          <img
            class="tip-icon"
            src="img/tipicon.png"
          />
          您可以使用鍵盤的上下方向鍵切換清單，並在下方即時預覽各種桁架橋範例。
        </div>
      </fieldset>
      <div>
        <jqxButton
          #cancelButton
          (onClick)="dialog.close()"
          style="float: right; margin-top: 40px; margin-right: 8px"
          [width]="'110px'"
          >取消</jqxButton
        >
      </div>
      <div>
        <jqxButton
          #okButton
          (onClick)="handleOkClick()"
          style="float: right; margin-top: 16px; margin-right: 8px"
          [width]="'110px'"
          >確定</jqxButton
        >
      </div>
    </div>
  </div>
</jqxWindow>
