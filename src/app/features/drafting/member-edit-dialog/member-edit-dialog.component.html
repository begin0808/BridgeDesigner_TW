<jqxWindow
  #dialog
  [isModal]="false"
  [autoOpen]="false"
  [width]="344"
  [height]="300"
>
  <div class="header">編輯所選桿件</div>
  <div class="container">
    <div class="inventory-selector">
      <div class="selector-label">桿件材料與規格：</div>
      <inventory-selector
        [vertical]="true"
        [sessionStateKey]="undefined"
      >
      </inventory-selector>
    </div>
    <div class="increase-size-button">
      <jqxButton
        #increaseSizeButton
        [width]="172"
        [height]="26"
        [imgPosition]="'left'"
        [textPosition]="'left'"
        [textImageRelation]="'imageBeforeText'"
        [imgSrc]="'img/sizeup.png'"
      >
        加大桿件尺寸
      </jqxButton>
    </div>
    <div class="decrease-size-button">
      <jqxButton
        #decreaseSizeButton
        [width]="172"
        [height]="26"
        [imgPosition]="'left'"
        [textPosition]="'left'"
        [textImageRelation]="'imageBeforeText'"
        [imgSrc]="'img/sizedown.png'"
      >
        縮小桿件尺寸
      </jqxButton>
    </div>
    <div class="delete-button">
      <jqxButton
        #deleteSelectionButton
        [width]="172"
        [height]="26"
        [imgPosition]="'left'"
        [textPosition]="'left'"
        [textImageRelation]="'imageBeforeText'"
        [imgSrc]="'img/delete.png'"
      >
        刪除選取項目
      </jqxButton>
    </div>
    <div class="member-list-button">
      <jqxToggleButton
        #memberListToggleButton
        [width]="120"
        [height]="26"
        [imgPosition]="'left'"
        [textPosition]="'left'"
        [textImageRelation]="'imageBeforeText'"
        [imgSrc]="'img/memtable.png'"
        [toggled]="true"
      >
        桿件明細表
      </jqxToggleButton>
    </div>
    <div class="close-button">
      <jqxButton
        [width]="120"
        [height]="26"
        (onClick)="dialog.close()"
      >
        關閉
      </jqxButton>
    </div>
  </div>
</jqxWindow>
