<toast></toast>
<div
  #wrapper
  class="wrapper"
>
  <canvas
    #draftingPanel
    class="view"
    [width]="width"
    [height]="height"
    (contextmenu)="ignore()"
  >
    <tool-selector #toolSelector></tool-selector>
  </canvas>
  <cursor-overlay
    #cursorLayer
    class="cursor"
    [width]="width"
    [height]="height"
    (addJointRequest)="handleAddJointRequest($event)"
    (addMemberRequest)="handleAddMemberRequest($event)"
    (deleteRequest)="handleDeleteRequest($event)"
    (moveJointRequest)="handleMoveJointRequest($event)"
    (dragCursorActive)="handleDragCursorActive($event)"
  ></cursor-overlay>
  <div
    #titleBlock
    class="title-block"
    (keydown)="handleTitleBlockKeyDown($event)"
  >
    <div class="project-name">
      <input
        #projectNameInput
        type="text"
        maxlength="40"
        [(ngModel)]="bridgeService.bridge.projectName"
      />
    </div>
    <div class="designer-name">
      設計者：
      <input
        #designerNameInput
        style="width: 200px"
        type="text"
        maxlength="40"
        placeholder="輸入您的姓名！"
        [(ngModel)]="bridgeService.bridge.designedBy"
      />
    </div>
    <div class="project-id">
      專案編號：
      <span class="scenario-id-text">000{{ bridgeService.bridge.designConditions.tag }}&nbsp;&#8209;&nbsp;</span
      ><input
        #projectIdInput
        style="width: 200px"
        type="text"
        maxlength="40"
        placeholder="輸入專案編號！"
        [(ngModel)]="bridgeService.bridge.projectId"
      />
    </div>
  </div>
</div>
