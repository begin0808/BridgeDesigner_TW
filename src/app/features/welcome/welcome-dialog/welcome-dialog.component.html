<jqxWindow
  #dialog
  [isModal]="true"
  [autoOpen]="false"
  [width]="840"
  [height]="322"
>
  <div
    #header
    class="header"
  >
    歡迎使用橋梁結構設計師…
  </div>
  <div class="content">
    <div class="banner">
      <img
        class="banner-img"
        src="img/banner.png"
      />
    </div>
    <div class="radio">
      <div class="radio-selection">
        <img
          class="radio-icon"
          src="img/new.png"
        />
        <jqxRadioButton
          #newButton
          style="display: inline-block"
          [groupName]="'startOptions'"
          [checked]="true"
        >
          <span>建立新的橋梁設計</span>
        </jqxRadioButton>
      </div>
      <div class="radio-selection">
        <img
          class="radio-icon"
          src="img/loadsample.png"
        />
        <jqxRadioButton
          #loadSampleButton
          style="display: inline-block"
          [groupName]="'startOptions'"
        >
          <span>載入範例橋梁設計</span>
        </jqxRadioButton>
      </div>
      <div class="radio-selection">
        <img
          class="radio-icon"
          src="img/open.png"
        />
        <jqxRadioButton
          #openButton
          style="display: inline-block"
          [groupName]="'startOptions'"
        >
          <span>繼續編輯已儲存的橋梁設計</span>
        </jqxRadioButton>
      </div>
    </div>
    <fieldset class="design-tip">
      <legend class="dialog-topic">設計提示：</legend>
      <div>
        <img
          class="tip-icon"
          src="img/tipicon.png"
        />
        您的目標是使用「橋梁結構設計師」設計一座成本盡可能低廉，且能順利通過載重測試、無任何桿件破壞的桁架橋。祝您設計順利！
      </div>
    </fieldset>
    <div class="button-column">
      <div>
        <img
          class="motif"
          src="img/motif01.png"
          title="美國賓夕法尼亞州 Lehigh Gap"
          alt="美國賓夕法尼亞州 Lehigh Gap"
        />
      </div>
      <jqxButton
        style="margin-top: 8px; margin-right: 2px"
        [width]="208"
        (onClick)="handleQuickStartButton()"
        >📖 新手速成指南…</jqxButton
      >
      <jqxButton
        style="margin-top: 8px; margin-right: 2px"
        [width]="208"
        (onClick)="handleAboutButton()"
        >關於…</jqxButton
      >
      <jqxButton
        style="margin-top: 8px; margin-right: 2px"
        [width]="208"
        (onClick)="dialog.close()"
        >取消</jqxButton
      >
      <jqxButton
        style="margin-top: 8px; margin-right: 2px"
        [width]="208"
        (onClick)="handleOkButton()"
        >確定</jqxButton
      >
    </div>
  </div>
</jqxWindow>
