<confirmation-dialog
  #dialog
  [headerHtml]="'繼續上次的設計進度？'"
  [buttons]="['yes', 'no']"
  [rememberKey]="'freshStart.dialog'"
  (onButtonClick)="handleButtonClick($event)"
>
  <p>您上次的設計進度已自動保留，是否要繼續編輯？</p>
  <p>若要繼續上次進度，請點擊 <b>是</b>。</p>
  <p>若要重新開始新設計，請點擊 <b>否</b>。</p>
</confirmation-dialog>
